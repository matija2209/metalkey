name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Smoke test
        run: .build/release/metalkey --help
      - name: Package
        run: |
          name="metalkey-${GITHUB_REF_NAME}-macos-arm64"
          mkdir -p "dist/$name"
          cp .build/release/metalkey README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
